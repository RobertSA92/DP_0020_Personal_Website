<article class="relative group bg-zinc-100 hover:bg-blue-100 rounded-3xl">
	
	<a class="insert-link" href="{{ .Permalink }}"></a>

	<figure class="w-full aspect-video overflow-hidden rounded-3xl">

		{{- $image := .Params.thumbnail | default .Params.image }}
		{{- if $image }}

		  {{- if (strings.HasPrefix $image "http") }}

			<img class="object-cover group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $image }}" alt="{{ $.Name }}" style="width: 100%; height: 100%; object-fit: cover;">

		  {{- else }}

			{{- with $imgcard := resources.Get $image -}}
			  {{- $imgcard := $imgcard.Process "resize 750x" -}}
			  <img class="object-cover group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $imgcard.RelPermalink }}" alt="{{ $.Name }}" width="{{ $imgcard.Width }}" height="{{ $imgcard.Height }}">
			{{- end }}

		  {{- end }}

		{{- end }}

	  </figure>

	<div class="p-6">

		<time datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" | safeHTML }}">{{ .Date.Format "Jan 02, 2006" }}</time>

		<h3 class="my-4 text-2xl font-bold">{{ .LinkTitle }}</h3>

		<p class="text-normal leading-normal text-zinc-500 line-clamp-2">{{ .Params.description }}</p>

		{{- with .GetTerms "tags" }}
		<ul class="flex flex-wrap gap-2 mt-4 relative z-20">
			{{- range . }}
				{{- if ne (lower .LinkTitle) "feature" }}
			<li><a class="text-xs py-1 px-3 border rounded-full bg-white hover:bg-zinc-200" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
				{{- end }}
			{{- end }}
		</ul>
		{{- end }}

	</div>
</article>
