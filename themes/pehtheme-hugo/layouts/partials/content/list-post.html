<article class="relative group flex flex-row">
	<a class="insert-link" href="{{ .Permalink }}"></a>
	<figure class="basis-1/3 aspect-video overflow-hidden rounded-2xl bg-zinc-100">

		{{- $image := .Params.thumbnail | default .Params.image }}
		{{- if $image }}

		  {{- if (strings.HasPrefix $image "http") }}

		  <img class="object-cover h-full w-full group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $image }}" alt="{{ $.Name }}" style="width: 100%; height: 100%; object-fit: cover;">

		  {{- else }}

			{{- with $imglist := resources.Get $image -}}
			  {{- $imglist := $imglist.Resize "250x" -}}
			  <img class="object-cover h-full w-full group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $imglist.RelPermalink }}" alt="{{ $.Name }}" width="{{ $imglist.Width }}" height="{{ $imglist.Height }}">
			{{- end }}

		  {{- end }}

		{{- end }}

	</figure>
	<div class="basis-2/3 self-center ml-4">
		<h3 class="font-bold group-hover:underline decoration-auto">{{ .LinkTitle }}</h3>
	</div>
</article>
